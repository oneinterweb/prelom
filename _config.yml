# prelom.bg — static Jekyll site (Minimal Mistakes)
encoding: "utf-8"
locale: "bg-BG"
lang: "bg"
timezone: Europe/Sofia
title: "Християнски Център Прелом"
masthead_title: "Християнски Център Прелом"
title_separator: "|"
subtitle: "Утре е сега!"
description: "Официален сайт на Християнски център Прелом."
name: "Християнски Център Прелом"
url: "https://prelom.bg"
# Apex canonical. www.prelom.bg CNAMEs to oneinterweb.github.io and GitHub redirects it.
# Merging this while the site is still previewed at oneinterweb.github.io/prelom breaks that preview.
baseurl: ""
repository: "oneinterweb/prelom"

logo: "/assets/images/logo.jpg"
theme: minimal-mistakes-jekyll
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  parse_block_html: false
highlighter: rouge
lsi: false
excerpt_separator: "<!--more-->"
incremental: false
words_per_minute: 200

permalink: /:slug/

search: true
search_full_content: true
search_provider: lunr

comments:
  provider: false

# Homepage puzzle uses the N most-used tags, recomputed on each build.
hero_puzzle_tag_limit: 30

# Contact form on /contact/ and /justice21/ POSTs here (Basic HTML).
formspree_endpoint: "https://formspree.io/f/meaozyyk"
# Hosted PayPal donate button copied from the live /donate/ form.
paypal_hosted_button_id: "DXW5MGAQ43QSJ"
# Optional PayPal business email if the hosted button is later replaced.
paypal_business: "YOUR_PAYPAL_BUSINESS"

atom_feed:
  hide: false

feed:
  path: /feed.xml

author:
  name: "Admin"
  avatar: "/assets/images/logo.jpg"
  bio: "Християнски център Прелом"
  location: "София, България"
  links:
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@PrelomCenter"

footer:
  links:
    - label: "Контакти"
      icon: "fas fa-fw fa-envelope"
      url: /contact/
    - label: "Дарения"
      icon: "fas fa-fw fa-heart"
      url: /donate/
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@PrelomCenter"
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook"
      url: "https://www.facebook.com/prelomcenter"
    - label: "X"
      icon: "fab fa-fw fa-x-twitter"
      url: "https://2x1.io/3foldonX"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      comments: false
      share: false

category_archive:
  type: jekyll-archives
  path: /category/

tag_archive:
  type: jekyll-archives
  path: /tag/

# Category/tag/author URLs are generated as static pages in _pages/tax/
# so every inventory slug resolves, including unused tags.
jekyll-archives:
  enabled: []
  layouts:
    category: archive-taxonomy
    tag: archive-taxonomy
  permalinks:
    category: /category/:name/
    tag: /tag/:name/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-archives
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-data

include:
  - _pages
  - wp-content
  - CNAME

exclude:
  - migration/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - node_modules
  - "*.gemspec"
  - tmp/

compress_html:
  clippings: all
  comments: all
  endings: all
  ignore:
    envs: [development]
  blanklines: false
  profile: false

# Preserve Cyrillic slugs in permalinks and archive URLs
slugify:
  mode: raw
  cased: false
