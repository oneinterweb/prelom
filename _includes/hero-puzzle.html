{% assign puzzle_src = '/assets/images/hero-speaker.jpg' | relative_url %}
<section class="hero-puzzle" data-hero-src="{{ puzzle_src }}" aria-label="Герой с етикети">
  <div class="hero-puzzle__frame">
    <img
      class="hero-puzzle__photo"
      src="{{ puzzle_src }}"
      alt="Георги Бакалов говори с микрофон"
      width="1920"
      height="1080"
    >
    <div class="hero-puzzle__board" data-puzzle-board></div>
  </div>

  <div class="hero-puzzle__copy">
    <p class="hero-puzzle__eyebrow">Християнски център Прелом</p>
    <h1 class="hero-puzzle__title">Утре е сега!</h1>
    <p class="hero-puzzle__hint">
      {{ site.tags.size }} етикета — преместете курсора върху снимката,
      за да обърнете квадратите и да ги разкриете.
      По-използваните етикети са по-големи.
    </p>
  </div>

  <script type="application/json" id="hero-puzzle-data">
  [
    {%- for tag in site.tags -%}
      {%- assign tname = tag[0] -%}
      {%- assign tposts = tag[1] -%}
      {
        "name": {{ tname | jsonify }},
        "label": {{ tname | replace: '-', ' ' | jsonify }},
        "url": {{ tname | prepend: '/tag/' | append: '/' | relative_url | jsonify }},
        "count": {{ tposts.size }}
      }{%- unless forloop.last -%},{%- endunless -%}
    {%- endfor -%}
  ]
  </script>
</section>
