{% assign latest = site.posts | slice: 0, 9 %}
<section class="home-latest" aria-labelledby="home-latest-title">
  <div class="home-latest__head">
    <h2 id="home-latest-title">Последни публикации</h2>
    <a class="home-latest__all" href="{{ '/year-archive/' | relative_url }}">Всички</a>
  </div>
  <ul class="home-latest__grid">
    {% for post in latest %}
      <li class="home-tile">
        <a class="home-tile__link" href="{{ post.url | relative_url }}">
          <span class="home-tile__media">
            {% include post-thumbnail.html post=post %}
          </span>
          <span class="home-tile__caption">
            <span class="home-tile__title">{{ post.title | escape }}</span>
          </span>
        </a>
      </li>
    {% endfor %}
  </ul>
</section>
